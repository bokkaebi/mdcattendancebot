[project]
name = "mdcattendance"
version = "0.1.0"
description = "Singpass attendance form auto-fill bot with OTP HTTP bridge"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-telegram-bot>=20.7,<23",
]

[project.scripts]
mdcattendance = "mdcattendance.__main__:main"
mdcattendance-tg = "mdcattendance.telegram_bot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdcattendance"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
